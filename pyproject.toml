[project]
# Distributionsname auf PyPI ("websearch" ist dort schon vergeben); Importname und CLI bleiben "websearch"
name = "websearch-mcp"
dynamic = ["version"]            # aus websearch/__init__.py (siehe [tool.hatch.version])
description = "Parallel, captcha-avoiding web search over free sources (SearXNG, Bing RSS, Google News, GDELT, ...) with CLI, MCP server and monitoring"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "websearch contributors" }]
requires-python = ">=3.10"
keywords = ["search", "web search", "metasearch", "searxng", "mcp", "model context protocol",
            "ai agents", "llm", "news monitoring"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Natural Language :: English",
  "Natural Language :: German",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "ddgs>=9.16,<10",       # nutzt ddgs-Interna (ENGINES, _get_engines) -> Major-Version pinnen
  "mcp>=2.3,<3",
  "trafilatura>=2.0,<3",   # Seiteninhalt -> Markdown (fetch_url)
  # trafilatura braucht lxml[html_clean]; pip < 23.3 löst dieses Extra von lxml nicht auf -> direkt angeben
  "lxml_html_clean>=0.4",
  "pydantic>=2.7",         # MCP-Schemas (kommt mit mcp, wird aber direkt importiert)
  "typing_extensions>=4.12",
  "starlette>=0.40",       # MCP-HTTP: /healthz, /metrics, Token-Prüfung (kommt mit mcp, direkt importiert)
  "uvicorn>=0.30",         # MCP-HTTP-Server (kommt mit mcp, direkt importiert)
]

[project.urls]
Homepage = "https://github.com/c0decave/web-search-mcp"
Documentation = "https://github.com/c0decave/web-search-mcp/blob/main/docs/USAGE.md"
Repository = "https://github.com/c0decave/web-search-mcp"
Issues = "https://github.com/c0decave/web-search-mcp/issues"
Changelog = "https://github.com/c0decave/web-search-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10"]

[project.scripts]
websearch = "websearch.__main__:run"
websearch-mcp = "websearch.__main__:run_mcp"   # direkt der MCP-Server (uvx websearch-mcp)

[build-system]
requires = ["hatchling>=1.27"]   # PEP 639 (license = "<SPDX>" + license-files), explizite sdist-Liste
build-backend = "hatchling.build"

[tool.hatch.version]
path = "websearch/__init__.py"   # __version__ = "..." - eine Quelle für Paket, CLI und Release-Tag

# nur das Paket (+ py.typed) bzw. Quellen fürs sdist - kein tests/, searxng/, .github/, Caches
[tool.hatch.build.targets.wheel]
packages = ["websearch"]
exclude = ["__pycache__", "*.pyc"]

[tool.hatch.build.targets.sdist]
# vollständige Quellverteilung: Doku (beide Sprachen), Vorlagen, Deploy-Dateien (Docker, Podman, bwrap)
include = ["/websearch", "/tests", "/README.md", "/README.de.md", "/ANALYSE.md", "/CHANGELOG.md", "/docs", "/LICENSE", "/pyproject.toml",
           "/requirements.lock", "/build-requirements.lock", "/build-requirements.in", "/.env.example",
           "/.env.example.de", "/watches.example.json", "/docker-compose.yml", "/Dockerfile", "/.dockerignore",
           "/searxng/settings.yml", "/deploy"]
exclude = ["__pycache__", "*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = ["relevance: Test mit echtem Relevanzfilter (Reddit)"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

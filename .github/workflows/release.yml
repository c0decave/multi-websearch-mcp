# Release bei Tag v*: Tests -> sdist/wheel -> PyPI (Trusted Publishing) + Multi-Arch-Image auf ghcr.io
#                      + GitHub-Release (Text aus CHANGELOG.md; a/b/rc-Versionen als Vorabversion)
#                      + Eintrag in die offizielle MCP Registry (server.json, nach PyPI)
#
# Einmalig einrichten:
#  - PyPI: Projekt -> Publishing -> "Add a trusted publisher" (GitHub, dieses Repo,
#    Workflow release.yml, Environment "pypi"); für das erste Release als "pending publisher"
#  - GitHub: Settings -> Environments -> "pypi" anlegen (optional mit Freigabe durch Reviewer)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
      - name: Tag passt zu websearch.__version__
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('websearch/__init__.py').read()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu __version__ = $version"
            exit 1
          fi
      - name: Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv pip install --system -r requirements.lock "pytest==9.2.0"
          uv pip install --system --no-deps -e .   # das Paket selbst: die bwrap-Wrapper starten ohne PYTHONPATH
          python -m pytest -q
      - name: sdist + wheel bauen
        run: |
          uv build
          uvx twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/websearch-mcp/
    permissions:
      id-token: write          # Trusted Publishing (OIDC), kein API-Token nötig
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
        with:
          skip-existing: true    # schon (z.B. von Hand) hochgeladene Version ist kein Fehler

  docker:
    name: Docker image (amd64 + arm64) -> ghcr.io
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Image-Name (ghcr verlangt Kleinbuchstaben)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ${{ env.IMAGE }}
          # v1.2.3 -> 1.2.3, 1.2, 1 (nicht bei 0.x), latest (nur für finale Versionen, flavor latest=auto);
          # Vorabversionen (v0.3.0rc1) bekommen nur ihre Versions-Tags: 0.3.0rc1 (wie __version__) und 0.3.0-rc1
          tags: |
            type=pep440,pattern={{version}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mcp-registry:
    name: MCP Registry
    needs: pypi                # die Registry prüft das Paket auf PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # Login bei der Registry per GitHub-OIDC, kein Token nötig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: server.json veröffentlichen
        run: .github/scripts/publish-mcp-registry.sh "${GITHUB_REF_NAME#v}"

  github-release:
    name: GitHub release
    needs: [build, docker]     # nicht auf PyPI warten: das GitHub-Release entsteht auch, wenn PyPI hakt
    runs-on: ubuntu-latest
    permissions:
      contents: write          # Release anlegen und Dateien anhängen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: dist
          path: dist/
      - name: Release anlegen (Text = Abschnitt der Version in CHANGELOG.md)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::Kein Abschnitt '## [$version]' in CHANGELOG.md"
            exit 1
          fi
          pre=()
          if [[ "$version" =~ (a|b|rc)[0-9]+$ ]]; then pre=(--prerelease); fi
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file notes.md "${pre[@]}"
